<title>Suivi vaccination – Kankossa | متابعة التلقيح – كنكوصة</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f5f7fa;--card:#fff;--tx:#1b2430;--mut:#64707e;--bd:#dde3ea;--pri:#0f766e;--r:#fde2e2;--rt:#b42318;--w:#fff1d6;--wt:#9a5b00;--g:#dcf5e4;--gt:#1a7f3c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#12171d;--card:#1b222b;--tx:#e8edf2;--mut:#9aa6b3;--bd:#2c3642;--pri:#2dd4bf;--r:#4a1d1d;--rt:#ffb4ab;--w:#4a3510;--wt:#ffd37a;--g:#17382a;--gt:#7be3a0}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px;background:var(--pri);color:#fff}
header h1{font-size:16px;margin:0}header small{opacity:.85;display:block;font-weight:400}
button,select,input{font:inherit}
.lang{background:#fff;color:#0f766e;border:0;border-radius:8px;padding:6px 12px;font-weight:700;cursor:pointer}
nav{display:flex;gap:6px;padding:10px 12px;overflow-x:auto;background:var(--card);border-bottom:1px solid var(--bd)}
nav button{flex:1;white-space:nowrap;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:8px;padding:8px 12px;cursor:pointer}
nav button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
main{max-width:980px;margin:0 auto;padding:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.k{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}.k b{display:block;font-size:26px}.k span{color:var(--mut);font-size:13px}
h2{font-size:15px;margin:18px 0 8px}
.sc{overflow-x:auto;background:var(--card);border:1px solid var(--bd);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:7px 9px;text-align:center;border-bottom:1px solid var(--bd);white-space:nowrap}
th{background:var(--bg);color:var(--mut);font-weight:600}
td:first-child,th:first-child{text-align:start}
.s{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:700}
.R{background:var(--r);color:var(--rt)}.F{background:var(--w);color:var(--wt)}.S{background:var(--g);color:var(--gt)}
td input{width:70px;padding:5px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);text-align:center}
select{padding:8px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);max-width:100%}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.note{color:var(--mut);font-size:13px;margin-top:10px}
.mb{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--bd)}
.E{background:#b42318;color:#fff}.ro{background:var(--bg)}.who{font-size:12px;opacity:.9}.cal{flex-basis:100%}.cal .yr{display:flex;align-items:center;gap:12px;margin-bottom:6px;font-weight:700}.cal .g{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px}.cal .g button{border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:8px;padding:9px 4px;cursor:pointer;font:inherit;font-size:13px}.cal .g button.on{background:var(--pri);color:#fff;border-color:var(--pri)}.cal .g button.cu{box-shadow:inset 0 -3px var(--pri)}.cal .g button.fu{border-style:dashed}.cal .g button:disabled{opacity:.35;cursor:default}
.sm{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:6px 10px;cursor:pointer}
</style>
</head>

<nav id="nav"></nav>
<div class="mb" id="mb"></div>
<main id="app"></main>
<script>
var AG=["BCG","HepB","VPO","HEXA","Pneumo","Rota","RR","PVH","Td"],DP="__depot";
var T={
fr:{t:"Suivi de la vaccination",sub:"Circonscription sanitaire de Kankossa",tabs:["Tableau de bord","Mouvements","Inventaire","Historique","Guide"],

 d:"Stock début",e:"Dotation reçue",a:"Administrées",p:"Pertes",f:"Stock fin",r:"Reçu",ds:"Distribué (auto)",
 thr:"Seuil de stock suffisant (doses)",addS:"Ajouter un établissement de santé (superviseur)",addPh:"Nom de l’établissement de santé",exists:"Ce nom existe déjà.",
 bad:"Valeur invalide : entrez un nombre entier supérieur ou égal à 0.",noW:"Enregistrement refusé : vous n’avez pas le droit de modifier ces données.",
 err:"Corrigez d’abord les stocks négatifs (cases rouges) avant de clôturer.",

 hist:"Stock fin par mois (dépôt / établissements)",pastA:"Mois clôturé : modifiable par le superviseur",corr:"Modification d’un mois clôturé : les stocks début des mois suivants sont recalculés automatiquement.",thru:function(n){return "Ouvrir tous les mois jusqu’à "+n+" ? Le stock fin sera reporté de mois en mois et "+n+" deviendra le mois en cours."},

ar:{t:"متابعة التلقيح",sub:"الدائرة الصحية لكنكوصة",tabs:["لوحة القيادة","الحركات","الجرد","السجل","الدليل"],
 depot:"مستودع المقاطعة",mois:"الشهر",cur:"الشهر الجاري",past:"شهر مغلق: للاطلاع فقط",close:"إغلاق الشهر والانتقال إلى الشهر الموالي",

 rup:"نفاد",fai:"ضعيف",suf:"كافٍ",ruptures:"النفاد",faibles:"الضعيف",stat:"الحالة",
 R:"نفاد",F:"مخزون ضعيف",S:"مخزون كافٍ",E:"خطأ",
 d:"مخزون البداية",e:"الكمية المستلمة",a:"الجرعات المعطاة",p:"الضائع",f:"مخزون النهاية",r:"المستلم",ds:"الموزَّع (تلقائي)",
 thr:"حد المخزون الكافي (جرعات)",addS:"إضافة منشأة صحية (المشرف)",addPh:"اسم المنشأة الصحية",exists:"هذا الاسم موجود مسبقاً.",
 bad:"قيمة غير صالحة: أدخل عدداً صحيحاً أكبر من أو يساوي 0.",noW:"تم رفض الحفظ: لا تملك صلاحية تعديل هذه البيانات.",
 err:"صحّح أولاً المخزونات السالبة (الخانات الحمراء) قبل الإغلاق.",
 cf:function(a,b){return "إغلاق "+a+" وفتح "+b+"؟\nسيصبح مخزون نهاية "+a+" هو مخزون بداية "+b+"، ولن يمكن تعديل الشهر المغلق."},
 mnote:"المخزون النهائي = مخزون البداية + الوارد − المعطاة − الضائع. بالنسبة للمنشأة، «الكمية المستلمة» هي ما وزّعه المستودع عليها، ويُخصم تلقائياً من مخزون المستودع.",
 hist:"المخزون النهائي حسب الشهر (المستودع / المنشآت)",pastA:"شهر مغلق: يمكن للمشرف تعديله",corr:"تعديل شهر مغلق: تُعاد حسابات مخزون بداية الأشهر اللاحقة تلقائياً.",thru:function(n){return "فتح جميع الأشهر حتى "+n+"؟ سيُرحَّل مخزون النهاية من شهر إلى آخر ويصبح "+n+" هو الشهر الجاري."},
 guide:["كل شهر يبقى مفتوحاً إلى أن يغلقه المشرف؛ الإغلاق يرحّل مخزون النهاية إلى بداية الشهر الموالي ويقفل الشهر المغلق.","مستودع المقاطعة يزوّد المنشآت وليس منها. ما تستلمه كل منشأة يُخصم تلقائياً من مخزون المستودع.","المشرف وحده يعدّل المستودع ويضيف المنشآت الصحية ويضبط الحد ويغلق الشهر.","الضبط: تُقبل الأعداد الصحيحة ≥ 0 فقط؛ والمخزون النهائي السالب يظهر «خطأ» ويمنع الإغلاق.","الحالة: نفاد = 0 جرعة؛ مخزون ضعيف = من 1 إلى الحد − 1؛ مخزون كافٍ = الحد أو أكثر (20 افتراضياً)."]}
};
var lang="fr",tab=0,cur=DP,vm=null,yr=null,CFG=null,DEP={},DAT={},db=null,admin=false,ready=false,pend=false,busy=false,tmo,KEY="kv-lang";
try{lang=localStorage.getItem(KEY)||"fr"}catch(e){}
function esc(x){return String(x).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function ml(m){var q=m.split("-");try{return new Date(+q[0],+q[1]-1,1).toLocaleDateString(lang=="ar"?"ar-u-nu-latn":"fr",{month:"long",year:"numeric"})}catch(e){return m}}
function nxt(m){var q=m.split("-"),d=new Date(+q[0],+q[1],1);return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)}
function M(){return vm&&CFG.months.indexOf(vm)>=0?vm:CFG.cur}
function sd(m,s,a){var x=DAT[m]&&DAT[m][s]&&DAT[m][s][a];return {d:+(x&&x.d)||0,e:+(x&&x.e)||0,a:+(x&&x.a)||0,p:+(x&&x.p)||0}}
function dd(m,a){var x=DEP[m]&&DEP[m][a];return {d:+(x&&x.d)||0,r:+(x&&x.r)||0,p:+(x&&x.p)||0}}
function sf(m,s,a){var r=sd(m,s,a);return r.d+r.e-r.a-r.p}
function dist(m,a){return CFG.structs.reduce(function(t,s){return t+sd(m,s.id,a).e},0)}
function df(m,a){var r=dd(m,a);return r.d+r.r-dist(m,a)-r.p}
function st(n){return n<0?"E":n==0?"R":n<CFG.thr?"F":"S"}
function bd(c){return '<span class="s '+c+'">'+T[lang][c]+'</span>'}
function hasErr(m){return AG.some(function(a){return df(m,a)<0||CFG.structs.some(function(s){return sf(m,s.id,a)<0})})}
function dash(){var t=T[lang],m=M(),R=0,F=0,tot=0,ra="",rd="",rs="";
 AG.forEach(function(a){var c={R:0,F:0,S:0,E:0},sum=0;CFG.structs.forEach(function(s){var n=sf(m,s.id,a);c[st(n)]++;sum+=n});R+=c.R;F+=c.F;tot+=sum;
  ra+="<tr><td>"+a+"</td><td>"+sum+"</td><td>"+c.R+"</td><td>"+c.F+"</td><td>"+c.S+"</td></tr>";
  var r=dd(m,a);rd+="<tr><td>"+a+"</td><td>"+r.d+"</td><td>"+r.r+"</td><td>"+dist(m,a)+"</td><td>"+r.p+"</td><td>"+df(m,a)+"</td><td>"+bd(st(df(m,a)))+"</td></tr>"});
 CFG.structs.forEach(function(s){var sum=0,r=0,f=0,e=0;AG.forEach(function(a){var n=sf(m,s.id,a),q=st(n);sum+=n;if(q=="R")r++;if(q=="F")f++;if(q=="E")e++});
  rs+="<tr><td>"+esc(s.name)+"</td><td>"+sum+"</td><td>"+r+"</td><td>"+f+"</td><td>"+bd(e?"E":r>0?"R":f>0?"F":"S")+"</td></tr>"});
 return '<div class="kpis"><div class="k"><b>'+CFG.structs.length+'</b><span>'+t.kS+'</span></div><div class="k"><b>'+AG.length+'</b><span>'+t.kA+'</span></div><div class="k"><b>'+tot+'</b><span>'+t.kT+'</span></div><div class="k"><b>'+R+'</b><span>'+t.kR+'</span></div><div class="k"><b>'+F+'</b><span>'+t.kF+'</span></div></div>'
 +'<h2>'+t.byD+'</h2><div class="sc"><table><tr><th>'+t.ag+'</th><th>'+t.d+'</th><th>'+t.r+'</th><th>'+t.ds+'</th><th>'+t.p+'</th><th>'+t.f+'</th><th>'+t.stat+'</th></tr>'+rd+'</table></div>'
 +'<h2>'+t.byA+'</h2><div class="sc"><table><tr><th>'+t.ag+'</th><th>'+t.tot+'</th><th>'+t.rup+'</th><th>'+t.fai+'</th><th>'+t.suf+'</th></tr>'+ra+'</table></div>'
 +'<h2>'+t.byS+'</h2><div class="sc"><table><tr><th>'+t.st+'</th><th>'+t.tot+'</th><th>'+t.ruptures+'</th><th>'+t.faibles+'</th><th>'+t.stat+'</th></tr>'+rs+'</table></div>'}
function inp(i,k,v,ok){return '<td><input type="number" min="0" step="1" inputmode="numeric" data-i="'+i+'" data-k="'+k+'" value="'+v+'"'+(ok?"":" disabled")+'></td>'}
function mouv(){var t=T[lang],m=M(),isD=cur==DP,open=m==CFG.cur||(admin&&CFG.months.indexOf(m)>=0),rows="",
 o='<option value="'+DP+'"'+(isD?" selected":"")+'>'+t.depot+'</option>'+CFG.structs.map(function(x){return '<option value="'+x.id+'"'+(x.id==cur?" selected":"")+'>'+esc(x.name)+'</option>'}).join("");
 AG.forEach(function(a,i){
  if(isD){var r=dd(m,a),n=df(m,a),w=open&&admin;rows+="<tr><td>"+a+"</td>"+inp(i,"d",r.d,w)+inp(i,"r",r.r,w)+"<td>"+dist(m,a)+"</td>"+inp(i,"p",r.p,w)+'<td id="f'+i+'">'+n+'</td><td id="s'+i+'">'+bd(st(n))+"</td></tr>"}
  else{var r=sd(m,cur,a),n=sf(m,cur,a);rows+="<tr><td>"+a+"</td>"+["d","e","a","p"].map(function(k){return inp(i,k,r[k],open)}).join("")+'<td id="f'+i+'">'+n+'</td><td id="s'+i+'">'+bd(st(n))+"</td></tr>"}});
 var hd=isD?[t.d,t.r,t.ds,t.p]:[t.d,t.e,t.a,t.p];
 return '<div class="bar"><select id="sel">'+o+'</select>'+(admin?'<label>'+t.thr+' <input id="thr" type="number" min="1" step="1" value="'+CFG.thr+'" style="width:70px"></label>':'')+'</div>'
 +'<div class="sc"><table><tr><th>'+t.ag+'</th>'+hd.map(function(x){return "<th>"+x+"</th>"}).join("")+'<th>'+t.f+'</th><th>'+t.stat+'</th></tr>'+rows+'</table></div><p class="note">'+t.mnote+(admin&&m!=CFG.cur?'<br>'+t.corr:'')+'</p>'
 +(admin?'<h2>'+t.addS+'</h2><div class="bar"><input id="ns" placeholder="'+t.addPh+'" style="padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx)"><button class="sm" id="as">+</button></div>':'')}
function inv(){var t=T[lang],m=M(),h="<tr><th>"+t.st+"</th>"+AG.map(function(a){return "<th>"+a+"</th>"}).join("")+"</tr>",b='<tr><td><b>'+t.depot+'</b></td>'+AG.map(function(a){var n=df(m,a);return '<td><span class="s '+st(n)+'">'+n+"</span></td>"}).join("")+"</tr>";
 CFG.structs.forEach(function(s){b+="<tr><td>"+esc(s.name)+"</td>"+AG.map(function(a){var n=sf(m,s.id,a);return '<td><span class="s '+st(n)+'">'+n+"</span></td>"}).join("")+"</tr>"});
 return '<div class="sc"><table>'+h+b+"</table></div>"}
function hist(){var t=T[lang],h="<tr><th>"+t.mois+"</th>"+AG.map(function(a){return "<th>"+a+"</th>"}).join("")+"</tr>",b="";
 CFG.months.slice().reverse().forEach(function(m){b+="<tr><td>"+ml(m)+"</td>"+AG.map(function(a){var n=0;CFG.structs.forEach(function(s){n+=sf(m,s.id,a)});return "<td>"+df(m,a)+" / "+n+"</td>"}).join("")+"</tr>"});
 return "<h2>"+t.hist+'</h2><div class="sc"><table>'+h+b+"</table></div>"}
function guide(){return '<div class="sc" style="padding:6px 16px">'+T[lang].guide.map(function(x){return "<p>"+x+"</p>"}).join("")+"</div>"}
function msg(x){document.getElementById("app").innerHTML='<p class="note">'+x+"</p>";document.getElementById("mb").style.display="none"}
function render(){var t=T[lang];document.documentElement.lang=lang;document.documentElement.dir=lang=="ar"?"rtl":"ltr";
 document.getElementById("ttl").innerHTML=t.t+"<small>"+t.sub+"</small>";
 document.getElementById("lg").textContent=lang=="fr"?"العربية":"Français";
 document.getElementById("nav").innerHTML=t.tabs.map(function(x,i){return '<button class="'+(i==tab?"on":"")+'" data-t="'+i+'">'+x+"</button>"}).join("");
 if(!ready)return msg(t.load);if(!db)return msg(t.nodb);if(!CFG)return msg(t.init);
 var m=M(),o=CFG.months.slice().reverse().map(function(x){return '<option value="'+x+'"'+(x==m?" selected":"")+'>'+ml(x)+(x==CFG.cur?" ●":"")+'</option>'}).join("");
 var mb=document.getElementById("mb");mb.style.display=tab==4?"none":"flex";
 mb.innerHTML=cal(m)+(m==CFG.cur?'<span class="s S">'+t.cur+'</span>':'<span class="s F">'+(admin?t.pastA:t.past)+'</span>')+(admin&&m==CFG.cur?'<button class="sm" id="cl"'+(busy?" disabled":"")+'>'+t.close+'</button>':'')+'<span class="who" style="margin-inline-start:auto">'+(admin?t.sup:t.agent)+'</span>';
 document.getElementById("app").innerHTML=[dash,mouv,inv,hist,guide][tab]();}
function rr(){var a=document.activeElement;if(a&&a.tagName=="INPUT"&&a.closest("#app")){pend=true}else render()}
function wr(pr){return pr.catch(function(){alert(T[lang].noW);render()})}
function saveCfg(){return wr(db.doc("config/main").set(CFG))}
function closeMonth(){var t=T[lang],m=CFG.cur,n=nxt(m);
 if(hasErr(m)){alert(t.err);return}
 if(!confirm(t.cf(ml(m),ml(n))))return;
 busy=true;render();var ps=[];
 CFG.structs.forEach(function(s){var o={},k=0;AG.forEach(function(a){var v=sf(m,s.id,a);if(v>0){o[a]={d:v,e:0,a:0,p:0};k++}});if(k)ps.push(db.doc("data/"+n+"_"+s.id).set(o))});
 var od={},kd=0;AG.forEach(function(a){var v=df(m,a);if(v>0){od[a]={d:v,r:0,p:0};kd++}});if(kd)ps.push(db.doc("depot/"+n).set(od));
